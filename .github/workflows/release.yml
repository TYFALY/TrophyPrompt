name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            output_name: TrophyPrompt-linux-x64
          - os: macos-latest
            target: osx-x64
            output_name: TrophyPrompt-osx-x64
          - os: macos-latest
            target: osx-arm64
            output_name: TrophyPrompt-osx-arm64
          - os: windows-latest
            target: win-x64
            output_name: TrophyPrompt-win-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Binary
        run: |
          dotnet publish TrophyPrompt.csproj -c Release -r ${{ matrix.target }} --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true -o ./publish

      - name: Package Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ./publish
          tar -czvf ../${{ matrix.output_name }}.tar.gz .

      - name: Package Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.output_name }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## TrophyPrompt v1.1.0

            **Cross-platform PS3 trophy timestamp editor** — now builds and runs on Windows, macOS (Intel + Apple Silicon), and Linux.

            ### What's new
            - **Vendored dependencies** — `TROPHYParser`, `BigEndianTool`, `pfdtool` all in `/vendor`, no external checkouts needed
            - **Cross-platform builds** — Single-file self-contained executables for all 4 targets
            - **CI/CD pipelines** — GitHub Actions builds on every PR, releases on tag push
            - **Overhauled README** — Quick-start, contributing guide, project structure, license

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `TrophyPrompt-win-x64.exe.zip` |
            | Linux x64 | `TrophyPrompt-linux-x64.tar.gz` |
            | macOS x64 (Intel) | `TrophyPrompt-osx-x64.tar.gz` |
            | macOS ARM64 (Apple Silicon) | `TrophyPrompt-osx-arm64.tar.gz` |

            ### Known limitation
            `pfdtool` (PFD encryption/decryption) is Windows-only. On macOS/Linux the app launches but decryption/encryption won't work unless you provide a cross-platform alternative or run the Windows binary via Wine.

            ### Building from source
            ```bash
            git clone https://github.com/TYFALY/TrophyPrompt.git
            cd TrophyPrompt
            dotnet build TrophyPrompt.sln -c Release
            dotnet run --project TrophyPrompt.csproj -c Release
            ```

            See [README](https://github.com/TYFALY/TrophyPrompt#readme) for full docs.
          files: |
            ./artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}