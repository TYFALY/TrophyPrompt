name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  ZIGLANG_VERSION: '0.17.1'

jobs:
  publish:
    name: Publish Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            output_name: TrophyPrompt-linux-x64
          - os: macos-latest
            target: osx-x64
            output_name: TrophyPrompt-osx-x64
          - os: macos-latest
            target: osx-arm64
            output_name: TrophyPrompt-osx-arm64
          - os: windows-latest
            target: win-x64
            output_name: TrophyPrompt-win-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (for zig)
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build native pfdtool
        if: matrix.os != 'windows-latest'
        run: |
          python -m pip install --quiet "ziglang==${ZIGLANG_VERSION}"
          ZIG="python -m ziglang" sh scripts/build-pfdtool.sh ${{ matrix.target }}

      - name: Publish Binary
        run: |
          dotnet publish TrophyPrompt.csproj -c Release -r ${{ matrix.target }} --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true -o ./publish

      - name: Verify bundled pfdtool
        if: matrix.os != 'windows-latest'
        run: |
          ls -l ./publish/pfdtool
          test -x ./publish/pfdtool/pfdtool
          test ! -e ./publish/pfdtool/pfdtool.exe
          # x64 macOS binaries may not run on the arm64 runner; check the rest execute.
          if [ "${{ matrix.target }}" != "osx-x64" ]; then
            out="$(cd ./publish/pfdtool && ./pfdtool -h || true)"
            echo "$out" | head -3
            echo "$out" | grep -q "by flatz"
          fi

      - name: Package Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ./publish
          tar -czvf ../${{ matrix.output_name }}.tar.gz .

      - name: Package Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.output_name }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd ./artifacts
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec sha256sum {} + | sed 's#\./[^/]*/##' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TrophyPrompt ${{ github.ref_name }}
          # Notes are generated from merged PRs/commits for each tag; the old
          # hardcoded "v1.1.0" body was being reused for every release.
          generate_release_notes: true
          body: |
            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `TrophyPrompt-win-x64.exe.zip` |
            | Linux x64 | `TrophyPrompt-linux-x64.tar.gz` |
            | macOS Intel | `TrophyPrompt-osx-x64.tar.gz` |
            | macOS Apple Silicon | `TrophyPrompt-osx-arm64.tar.gz` |

            Verify downloads with `SHA256SUMS.txt`.

            macOS/Linux builds bundle a native `pfdtool` (from [bucanero/pfd_sfo_tools](https://github.com/bucanero/pfd_sfo_tools)), so no Wine is needed.
            On macOS, if Gatekeeper blocks the app: `xattr -dr com.apple.quarantine <extracted folder>`.
          files: |
            ./artifacts/*/*
            ./SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
